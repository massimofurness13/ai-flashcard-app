name: Validate app

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-only fixtures. Tests mock external services; no production keys
      # or database connection are made available to pull requests.
      DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/fixture
      NEXT_PUBLIC_SUPABASE_URL: https://fixture.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run build
      - run: npx tsc --noEmit
