name: Push reminders cron

on:
  schedule:
    # Every 15 minutes. GitHub cron schedule is best-effort — occasional
    # 5-10 min delays are normal, which is fine for a nudge notification.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    name: POST /api/cron/push-reminders
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fire cron endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL or CRON_SECRET secret not set in repo settings"
            exit 1
          fi
          curl -fsS -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            -w "\nstatus=%{http_code} time=%{time_total}s\n" \
            "$APP_URL/api/cron/push-reminders"
