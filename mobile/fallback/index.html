<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Huella</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f0d0a;
        color: #f5f0e8;
        font-family:
          ui-serif, Georgia, "Times New Roman", serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .wrap {
        padding: 2rem;
        max-width: 22rem;
      }
      .word {
        font-size: 2.25rem;
        letter-spacing: -0.01em;
      }
      .word .hu {
        font-style: italic;
        color: #d4a373;
      }
      p {
        margin-top: 1rem;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.9rem;
        color: #b8b0a4;
        line-height: 1.5;
      }
      button {
        margin-top: 1.5rem;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #d4a373;
        color: #1c1613;
        border: 0;
        border-radius: 0.6rem;
        padding: 0.7rem 1.4rem;
        font-size: 0.95rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <!--
      This page is the Capacitor `webDir` fallback. The app normally
      loads the live Huella server (set as server.url in
      capacitor.config). This static page only appears if the device
      is offline or the server can't be reached at launch — it gives
      the user a branded "reconnect" screen instead of a blank webview.
    -->
    <div class="wrap">
      <div class="word"><span class="hu">Hu</span>ella</div>
      <p>
        Couldn't reach Huella. Check your connection and try again — your
        cards and progress are safe on the server.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
